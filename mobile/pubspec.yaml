name: focuslock
description: "AI-powered smartphone lock screen management app for enhanced focus."
publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_database: ^12.6.0
  http: ^1.1.0
  provider: ^6.1.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
